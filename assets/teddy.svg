<svg xmlns="http://www.w3.org/2000/svg" width="300" height="350" viewBox="0 0 300 350">
  <!-- Teddy Bear with party hat placeholder -->
  <!-- Body -->
  <ellipse cx="150" cy="250" rx="85" ry="90" fill="#c49a6c"/>
  <ellipse cx="150" cy="255" rx="65" ry="55" fill="#d4a96c"/>
  <!-- Head -->
  <circle cx="150" cy="155" r="65" fill="#c49a6c"/>
  <!-- Ears -->
  <circle cx="95" cy="105" r="25" fill="#c49a6c"/>
  <circle cx="95" cy="105" r="15" fill="#e8c49a"/>
  <circle cx="205" cy="105" r="25" fill="#c49a6c"/>
  <circle cx="205" cy="105" r="15" fill="#e8c49a"/>
  <!-- Face -->
  <ellipse cx="150" cy="170" rx="25" ry="18" fill="#e8c49a"/>
  <circle cx="130" cy="145" r="7" fill="#3a2a1a"/>
  <circle cx="170" cy="145" r="7" fill="#3a2a1a"/>
  <circle cx="132" cy="143" r="2.5" fill="white"/>
  <circle cx="172" cy="143" r="2.5" fill="white"/>
  <ellipse cx="150" cy="163" rx="6" ry="4" fill="#3a2a1a"/>
  <path d="M144 172 Q150 180 156 172" stroke="#3a2a1a" stroke-width="2" fill="none"/>
  <!-- Arms -->
  <ellipse cx="75" cy="230" rx="25" ry="40" fill="#c49a6c" transform="rotate(-15, 75, 230)"/>
  <ellipse cx="225" cy="230" rx="25" ry="40" fill="#c49a6c" transform="rotate(15, 225, 230)"/>
  <!-- Feet -->
  <ellipse cx="115" cy="320" rx="30" ry="22" fill="#c49a6c"/>
  <ellipse cx="115" cy="322" rx="20" ry="14" fill="#e8c49a"/>
  <ellipse cx="185" cy="320" rx="30" ry="22" fill="#c49a6c"/>
  <ellipse cx="185" cy="322" rx="20" ry="14" fill="#e8c49a"/>
  <!-- Party Hat -->
  <polygon points="150,55 125,115 175,115" fill="#ff4d97"/>
  <polygon points="150,55 135,90 165,90" fill="#f0b44c" opacity="0.5"/>
  <circle cx="150" cy="52" r="8" fill="#f0b44c"/>
  <line x1="125" y1="115" x2="175" y2="115" stroke="#f0b44c" stroke-width="4"/>
  <!-- Gift box in arms -->
  <rect x="120" y="215" width="60" height="45" rx="4" fill="#ff4d97"/>
  <rect x="145" y="215" width="10" height="45" fill="#f0b44c"/>
  <rect x="120" y="210" width="60" height="12" rx="3" fill="#d81b7a"/>
  <path d="M150 210 Q140 195 130 210" stroke="#f0b44c" stroke-width="3" fill="none"/>
  <path d="M150 210 Q160 195 170 210" stroke="#f0b44c" stroke-width="3" fill="none"/>
  <!-- Blush -->
  <circle cx="118" cy="168" r="10" fill="#ffb3b3" opacity="0.5"/>
  <circle cx="182" cy="168" r="10" fill="#ffb3b3" opacity="0.5"/>
</svg>
